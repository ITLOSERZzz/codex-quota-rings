name: Windows checks and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
          architecture: x64
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.mjs
      - name: Browser integration
        run: node tests/browser.mjs
      - name: Windows PowerShell installer integration
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/installer.ps1
      - name: Installer success-message regression
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/installer-messages.ps1
      - name: Launcher waiting and cancellation
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/launcher.ps1
      - name: Main exit with a lingering worker process
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/process-exit.ps1
      - name: On-demand task ownership (in-memory doubles)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/task-runner.ps1
      - name: Bundle runtime and installer
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
          architecture: x64
      - name: Verify tag version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package.json version' }
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "Codex Quota Rings $env:GITHUB_REF_NAME"
          }
